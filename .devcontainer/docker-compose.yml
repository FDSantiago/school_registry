# Development environment only. The production compose file lives in the repo root.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/sia_school-registry:cached
    command: sleep infinity
    environment:
      DATABASE_URL: mysql://registry:registry@mysql:3306/school_registry?sslmode=require
      TEST_DATABASE_URL: mysql://registry:registry@mysql:3306/school_registry_test?sslmode=require
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: school_registry
      MYSQL_USER: registry
      MYSQL_PASSWORD: registry
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
