# Runs the API and its MySQL database. Keys are read from .env (copy .env.example).
#   docker compose up --build
services:
  api:
    build: .
    ports:
      # Host port is configurable in case 4000 is taken (e.g. by the dev container's port forward).
      - "${API_HOST_PORT:-4000}:4000"
    environment:
      PORT: 4000
      DATABASE_URL: mysql://registry:registry@mysql:3306/school_registry?sslmode=require
      REGISTRY_READ_KEY: ${REGISTRY_READ_KEY:?Set REGISTRY_READ_KEY in .env}
      REGISTRY_ADMIN_KEY: ${REGISTRY_ADMIN_KEY:?Set REGISTRY_ADMIN_KEY in .env}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # The Bun image has no curl, so use Bun's fetch.
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: school_registry
      MYSQL_USER: registry
      MYSQL_PASSWORD: registry
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
